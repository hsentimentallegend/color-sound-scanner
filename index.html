<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Color Sound</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; background:#000; color:#fff;
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  main { max-width:520px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 48px) 16px 48px;
    display:flex; flex-direction:column; gap:14px; }
  h1 { margin:0 0 4px; font-size:24px; font-weight:600; letter-spacing:.04em; text-align:center; }
  .lead { margin:0 0 18px; opacity:.6; font-size:13px; text-align:center; line-height:1.7; }
  a.app, div.app { display:block; padding:18px 20px; border-radius:14px; color:#fff; text-decoration:none;
    border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.04); }
  a.app:active { background:rgba(255,255,255,.1); }
  .app b { display:block; font-size:18px; font-weight:600; letter-spacing:.03em; margin-bottom:4px; }
  .app span { font-size:13px; opacity:.7; line-height:1.6; }
  div.app { opacity:.45; }
</style>
</head>
<body>
<main>
  <h1>Color Sound</h1>
  <p class="lead">カメラに映る色が、そのまま音になる楽器たち</p>
  <a class="app" href="gaze/"><b>Color Sound Gaze</b><span>マス目ひとつひとつの色が、歪んだ轟音の壁になる</span></a>
  <a class="app" href="haze/"><b>Color Sound Haze</b><span>色がゆっくり漂うアンビエントになる。サティ風のピアノも</span></a>
  <a class="app" href="scanner/"><b>Color Sound Scanner</b><span>スキャンバーが画面を横切り、通った色を順に鳴らす</span></a>
</main>
</body>
</html>
