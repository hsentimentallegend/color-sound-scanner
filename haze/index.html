<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Color Sound Hazer</title>
<style>
  :root { --fg:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#000; color:var(--fg);
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; overflow:hidden;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #view { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  video, #ana { display:none; }

  #key { position:fixed; right:12px; top:calc(env(safe-area-inset-top) + 8px); font-size:13px; text-align:right;
    text-shadow:0 1px 3px #000; pointer-events:none; opacity:.92; line-height:1.5; }
  #key[data-note]::after { content:attr(data-note); display:block; font-size:11px; opacity:.8; }
  #hint { position:fixed; left:12px; top:calc(env(safe-area-inset-top) + 8px); font-size:11px; opacity:.7;
    text-shadow:0 1px 3px #000; pointer-events:none; line-height:1.5; max-width:50vw; }
  #focusRing { position:fixed; width:72px; height:72px; margin:-36px 0 0 -36px; border:2px solid #ffd54a; border-radius:8px;
    pointer-events:none; opacity:0; transform:scale(1.4); transition:opacity .2s, transform .25s; }
  #focusRing.show { opacity:1; transform:scale(1); }
  #focusRing.fail { border-color:rgba(255,255,255,.5); }

  /* 操作パネル（パネルの外側の透明部分は画面の演奏に使えるよう、触れても反応しない） */
  #ui { position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(env(safe-area-inset-bottom) + 14px);
    display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none;
    background:linear-gradient(transparent, rgba(0,0,0,.6) 40%); }
  #ui > * { pointer-events:auto; }
  .row { width:100%; max-width:480px; display:grid; grid-template-columns:4.8em 1fr 4.8em; align-items:center; gap:8px;
    font-size:13px; text-shadow:0 1px 2px #000; }
  .row span:last-child { text-align:right; }
  input[type=range] { width:100%; height:30px; accent-color:#fff; }
  .seg { display:flex; border:1px solid rgba(255,255,255,.7); border-radius:16px; overflow:hidden; }
  .seg button { flex:1; height:30px; border:0; background:transparent; color:#fff; font-size:12px; cursor:pointer;
    touch-action:manipulation; }
  .seg button.on { background:#fff; color:#000; font-weight:600; }
  .btns { display:flex; align-items:center; justify-content:center; gap:22px; margin-top:4px; }
  .btns .pad { width:60px; }
  #power { width:80px; height:80px; border-radius:50%; border:3px solid #fff; background:#222;
    color:#fff; font-size:19px; font-weight:700; letter-spacing:.05em; cursor:pointer;
    box-shadow:0 4px 18px rgba(0,0,0,.6); transition:background .6s, transform .08s; touch-action:manipulation; }
  #power:active { transform:scale(.95); }
  #power.off { background:#222 !important; color:#fff !important; opacity:.75; }
  #lock { width:60px; height:60px; border-radius:50%; border:2px solid rgba(255,255,255,.75); background:rgba(0,0,0,.4);
    color:#fff; font-size:13px; font-weight:600; line-height:1.15; cursor:pointer; touch-action:manipulation;
    display:flex; flex-direction:column; align-items:center; justify-content:center; transition:transform .08s; }
  #lock small { font-size:10px; font-weight:400; opacity:.85; }
  #lock:active { transform:scale(.94); }
  #lock.on { border:3px solid #fff; box-shadow:0 0 14px rgba(255,255,255,.7); font-size:18px; }

  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:#000; z-index:10; text-align:center; padding:24px; cursor:pointer; }
  #start h1 { margin:0; font-size:26px; font-weight:600; letter-spacing:.04em; }
  #start p { margin:0; opacity:.7; font-size:14px; line-height:1.7; }
  #msg { color:#f88; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<video id="video" playsinline muted autoplay></video>
<canvas id="ana"></canvas>

<div id="hint">タップ：焦点<br>長押し・なぞる：そこから音が湧く<br>上下ドラッグ：テープのように沈む・浮く</div>
<div id="key"></div>
<div id="focusRing"></div>

<div id="ui">
  <div class="row"><span>まとまり</span><input id="coh" type="range" min="0" max="1" step="0.001" value="0.75"><span id="cohL">和音寄り</span></div>
  <div class="row"><span>呼吸</span><input id="breath" type="range" min="0" max="1" step="0.01" value="0.35"><span id="breathL">ゆったり</span></div>
  <div class="row"><span>残響</span><input id="rev" type="range" min="0" max="1" step="0.01" value="0.7"><span id="revL">70%</span></div>
  <div class="row"><span>粒</span><input id="grit" type="range" min="0" max="1" step="0.01" value="0.3"><span id="gritL">30%</span></div>
  <div class="row"><span>サティ</span><div class="seg" id="satieSeg">
    <button data-s="off" class="on">オフ</button><button data-s="waltz">3拍子</button><button data-s="free">自由</button>
  </div><span id="satieL"></span></div>
  <div class="row"><span>マス目</span><div class="seg" id="gridSeg">
    <button data-g="3x2">6</button><button data-g="4x3">12</button><button data-g="6x4" class="on">24</button>
  </div><span id="gridL">24マス</span></div>
  <div class="btns"><button id="lock">主音<small>ロック</small></button><button id="power">ON</button><span class="pad"></span></div>
</div>

<div id="start">
  <h1>Color Sound Hazer</h1>
  <p>画面のマス目の色が、ゆっくり漂う音になります。<br>タップしてカメラと音を開始<br>（PCはスペースキーでオン／オフ、Lキーで主音ロック）</p>
  <p id="msg"></p>
</div>

<script>
(() => {
"use strict";
/* ---------- 設定 ---------- */
const CELL_PX = 6;            // 解析用キャンバスでの1マスのピクセル数
const TICK = 1000 / 15;       // 解析間隔（約15回/秒）
const SLOTS = 6;              // 呼吸する音の層の数
const LOOP_RATIOS = [1, 1.31, 1.62, 1.93, 2.37, 2.71];   // 層ごとの周期の比（割り切れない比で、同じ重なりが繰り返されにくい）

const $ = id => document.getElementById(id);
const view = $("view"), vctx = view.getContext("2d");
const video = $("video");
const ana = $("ana"), actx2d = ana.getContext("2d", { willReadFrequently: true });
const keyEl = $("key"), powerBtn = $("power"), lockBtn = $("lock");
const cohEl = $("coh"), breathEl = $("breath"), revEl = $("rev"), gritEl = $("grit");

/* ---------- 便利関数 ---------- */
function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d > 0) {
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return [h, mx ? d / mx : 0, mx];
}
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const midiToFreq = m => 440 * Math.pow(2, (m - 69) / 12);
const freqToMidi = f => Math.round(69 + 12 * Math.log2(f / 440));

/* ---------- 色 → 感情 → 調（Color Sound Generator のルール） ---------- */
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SCALES = {
  major:            { steps: [0, 2, 4, 5, 7, 9, 11], ja: 'メジャー' },
  minor:            { steps: [0, 2, 3, 5, 7, 8, 10], ja: 'マイナー' },
  pentatonic_major: { steps: [0, 2, 4, 7, 9],        ja: 'メジャー・ペンタトニック' },
  pentatonic_minor: { steps: [0, 3, 5, 7, 10],       ja: 'マイナー・ペンタトニック' },
  blues:            { steps: [0, 3, 5, 6, 7, 10],    ja: 'ブルース' }
};
function classify(h, chroma, v) {
  if (!chroma) {
    if (v > 0.8) return { emotion: 'Clarity', baseFreq: 650, scale: 'major' };
    if (v < 0.2) return { emotion: 'Depth', baseFreq: 120, scale: 'minor' };
    return { emotion: 'Neutral', baseFreq: 200 + v * 250, scale: v > 0.6 ? 'pentatonic_major' : 'pentatonic_minor' };
  }
  if (h < 0.05 || h >= 0.95) return { emotion: 'Passion', baseFreq: 550 + v * 100, scale: v > 0.5 ? 'major' : 'blues' };
  if (h < 0.15) return { emotion: 'Warmth', baseFreq: 500 + v * 100, scale: 'major' };
  if (h < 0.25) return { emotion: 'Joy', baseFreq: 480 + v * 120, scale: 'pentatonic_major' };
  if (h < 0.35) return { emotion: 'Freshness', baseFreq: 450 + v * 100, scale: 'major' };
  if (h < 0.45) return { emotion: 'Peace', baseFreq: 400 + v * 100, scale: v > 0.5 ? 'pentatonic_major' : 'pentatonic_minor' };
  if (h < 0.55) return { emotion: 'Calm', baseFreq: 350 + v * 100, scale: v > 0.6 ? 'major' : 'minor' };
  if (h < 0.70) return { emotion: 'Melancholy', baseFreq: 300 + v * 100, scale: 'minor' };
  if (h < 0.85) return { emotion: 'Mystery', baseFreq: 280 + v * 120, scale: 'blues' };
  return { emotion: 'Creativity', baseFreq: 600 + v * 150, scale: v > 0.5 ? 'major' : 'minor' };
}
// スケールの中で3度ずつ積んだ構成音（1-3-5-7-9）。くすんだ画面では3度を抜いて sus にする
function chordTones(steps, sus, airy) {
  const has = s => steps.includes(((s % 12) + 12) % 12);
  const pick = (cands, fb) => { for (const c of cands) if (has(c)) return c; return fb; };
  let third = pick([4, 3], 4), susName = '';
  if (sus) {
    const s = pick(airy ? [2, 5] : [5, 2], null);
    if (s !== null) { third = s; susName = s === 2 ? 'sus2' : 'sus4'; }
  }
  const fifth = pick([7, 6, 8], 7);
  let ninth = pick([14, 13, 17], 14);
  if ((ninth - third) % 12 === 0) ninth = fifth + 12;
  return { '1': 0, '3': third, '5': fifth, '7': pick([10, 11, 9], 10), '9': ninth, susName };
}
function chordName(rootPc, T) {
  let s = NOTE_NAMES[rootPc];
  if (T.susName === '' && T['3'] === 3) s += 'm';
  s += T['7'] === 11 ? 'maj7' : T['7'] === 9 ? '6' : '7';
  s += T.susName;
  if (T['5'] === 6) s += '(♭5)'; else if (T['5'] === 8) s += '(♯5)';
  s += T['9'] === 14 ? '(9)' : T['9'] === 13 ? '(♭9)' : T['9'] === 17 ? '(11)' : '';
  return s;
}
function nearestTone(m, rootPc, pcs) {
  let best = 0, bd = 1e9;
  const base = Math.floor(m / 12) * 12;
  for (let o = -12; o <= 12; o += 12) for (const pc of pcs) {
    const cand = base + o + ((rootPc + pc) % 12 + 12) % 12, d = Math.abs(cand - m);
    if (d < bd) { bd = d; best = cand; }
  }
  return best;
}

/* ---------- オーディオ ----------
   土台：マスごとの三角波が、色をゆっくり追いながら小さく鳴り続ける（画面全体が天気のように移ろう）
   呼吸：長さの違う周期で、色の強いマスから1音ずつ浮かび上がる（満ちて引く、フィルターが息をする）
   空間：テープの揺れ → 軽い飽和 → テープエコー・長い残響（1オクターブ上のきらめきは残響の中だけ）
   質感：映像が動くとデジタルの粒が散る。ヒスとプチプチがうっすら下に敷かれる */
let ac, master, bus, padBus, padLP, warm, conv, revGain, shimmer, hissG, crkG, drone, noiseBuf;
let pads = [], running = false, started = false;

function softCurve(k) {
  const n = 2048, c = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); }
  return c;
}
function makeImpulse(sec) {
  const sr = ac.sampleRate, len = Math.floor(sr * sec), buf = ac.createBuffer(2, len, sr), atk = sr * 0.06;
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6) * Math.min(1, i / atk);
  }
  return buf;
}
function initAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const G = v => { const g = ac.createGain(); g.gain.value = v; return g; };
  const BQ = (type, f, q) => { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };

  // テープの揺れ：本物のテープと同じく、全体の音を通す短いディレイの長さを揺らして音程をよれさせる。
  // （以前は全オシレーターの音程に直接つないでいたが、それだと1本ずつ毎サンプル計算が必要で重く、音が途切れた）
  const wow = ac.createOscillator(); wow.frequency.value = 0.21;
  const flut = ac.createOscillator(); flut.frequency.value = 5.7;
  wow.start(); flut.start();

  // マスター：コンプ → メイクアップ → リミッター → オン／オフ
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -20; comp.ratio.value = 3; comp.knee.value = 12; comp.attack.value = 0.02; comp.release.value = 0.4;
  const makeup = G(2.4);
  const lim = ac.createDynamicsCompressor();
  lim.threshold.value = -2; lim.ratio.value = 20; lim.knee.value = 0; lim.attack.value = 0.003; lim.release.value = 0.2;
  master = G(0);
  comp.connect(makeup).connect(lim).connect(master).connect(ac.destination);

  // 本体の経路：軽い飽和 → 明るさで開くフィルター → 低域カット → ドライ／残響／エコー
  bus = G(1);
  const sat = ac.createWaveShaper(); sat.curve = softCurve(1.6);   // 飽和は軽いので、オーバーサンプリングなしで十分
  warm = BQ("lowpass", 4000, 0.5);
  const hp = BQ("highpass", 55, 0.7);
  const wob = ac.createDelay(0.1); wob.delayTime.value = 0.02;
  wow.connect(G(0.004)).connect(wob.delayTime);      // ゆっくりしたよれ（±10セントほど）
  flut.connect(G(0.00006)).connect(wob.delayTime);   // 細かい震え（±4セントほど）
  bus.connect(wob).connect(G(0.9)).connect(sat).connect(warm).connect(hp);
  hp.connect(G(0.5)).connect(comp);
  // 残響：長さを8秒→4秒にして軽く（余韻の長さはテープエコーの繰り返しでも補う）
  // 残響に入る音は、先に高域を丸めておく（高い音が残響で重なっても耳に痛くならないように）。
  // conv はこの「残響の入口」で、エコー・きらめき・粒もここを通って残響へ入る
  conv = BQ("lowpass", 2600, 0.5);
  const revShelf = BQ("highshelf", 1500, 0.7); revShelf.gain.value = -5;
  const cv = ac.createConvolver(); cv.buffer = makeImpulse(4);
  revGain = G(0.8);
  conv.connect(revShelf).connect(cv).connect(revGain).connect(comp);
  hp.connect(conv);
  const dl = ac.createDelay(2); dl.delayTime.value = 0.68;
  const fb = G(0.42), elp = BQ("lowpass", 2200, 0.5);
  hp.connect(G(0.35)).connect(dl); dl.connect(elp).connect(fb).connect(dl);
  elp.connect(G(0.45)).connect(comp); elp.connect(conv);
  wow.connect(G(0.0015)).connect(dl.delayTime);
  shimmer = G(1); shimmer.connect(conv);

  // 土台の層：やわらかく丸めてから本体へ
  padBus = G(1); padLP = BQ("lowpass", 1800, 0.4);
  padBus.connect(padLP).connect(bus);

  // ヒスとプチプチ
  const sr = ac.sampleRate;
  noiseBuf = ac.createBuffer(1, sr * 3, sr);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const hissSrc = ac.createBufferSource(); hissSrc.buffer = noiseBuf; hissSrc.loop = true;
  hissG = G(0); hissSrc.connect(BQ("highpass", 4000, 0.5)).connect(hissG).connect(comp); hissSrc.start();
  const crk = ac.createBuffer(1, sr * 4, sr), cd = crk.getChannelData(0);
  for (let k = 0; k < 4 * 18; k++) {
    const at = Math.floor(Math.random() * (cd.length - 40)), a = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? -1 : 1);
    for (let j = 0; j < 30; j++) cd[at + j] += a * Math.exp(-j / 4) * (j % 2 ? -0.6 : 1);
  }
  const crkSrc = ac.createBufferSource(); crkSrc.buffer = crk; crkSrc.loop = true;
  crkG = G(0);
  crkSrc.connect(BQ("bandpass", 2500, 0.5)).connect(crkG); crkG.connect(comp); crkG.connect(G(0.3)).connect(conv); crkSrc.start();

  // 主音と5度の持続音（ふだんはうっすら、主音ロック中ははっきり）
  const d1 = ac.createOscillator(), d2 = ac.createOscillator(), dG = G(0), d2G = G(0.35);
  d1.type = "sine"; d2.type = "triangle"; d1.frequency.value = 65; d2.frequency.value = 98;
  d1.connect(dG); d2.connect(d2G).connect(dG); dG.connect(bus);
  linkPitch(d1); linkPitch(d2); d1.start(); d2.start();
  drone = { d1, d2, g: dG };
  initNotePool();
  initGrainPool();
  initPiano();
}
// 音程の沈み／浮き（上下ドラッグ）の対象として登録／解除する。
// 音程は指が動いたときだけ、まとめて書き換える（常時つないでおく方式より軽い）
const pitched = new Set();
function linkPitch(o, det = 0) { o._det = det; o.detune.value = det + bendSent; pitched.add(o); }
function unlinkPitch(o) { pitched.delete(o); }
// 音程を書き換える：先の予定を消して目標へなめらかに寄せ、最後に「固定値」で締める。
// 締めないと、目標に近づき続ける計算が音の部品ごとに毎サンプル残り続けて重くなる
function writeDetune(o, t, tc) {
  const v = o._det + bendSent, p = o.detune;
  p.cancelScheduledValues(t);
  if (tc > 0) { p.setTargetAtTime(v, t, tc); p.setValueAtTime(v, t + tc * 6); }
  else p.setValueAtTime(v, t);
}
/* 鳴っていない声は、音の流れから外して眠らせる（外れた部品はブラウザが計算しない）。
   部品を作り直すわけではないので、作る瞬間の負荷の山は出ない */
function sleepVoice(vo) {
  if (!vo.awake) return;
  vo.awake = false;
  for (const [node] of vo.outs) node.disconnect();
  for (const o of vo.oscs) pitched.delete(o);
}
function wakeVoice(vo) {
  if (vo.awake) return;
  vo.awake = true;
  for (const [node, dest] of vo.outs) node.connect(dest);
  const t = ac.currentTime;
  for (const o of vo.oscs) { pitched.add(o); writeDetune(o, t, 0); }
}

/* ---------- マス目（1マス＝土台の1声） ---------- */
let GX = 6, GY = 4, gridSpec = "6x4";
let cells = [], swell = new Float32Array(0), glow = new Float32Array(0), glowNote = [], prevL = new Float32Array(0);
function buildGrid(spec) {
  gridSpec = spec;
  let [a, b] = spec.split("x").map(Number);
  if (innerHeight > innerWidth) [a, b] = [Math.min(a, b), Math.max(a, b)];   // 縦長の画面ではマス目も縦長に
  else [a, b] = [Math.max(a, b), Math.min(a, b)];
  GX = a; GY = b;
  const n = GX * GY;
  ana.width = GX * CELL_PX; ana.height = GY * CELL_PX;
  cells = Array.from({ length: n }, () => ({ h: 0, s: 0, v: 0 }));
  swell = new Float32Array(n); glow = new Float32Array(n); glowNote = new Array(n).fill(""); prevL = new Float32Array(n);
  $("gridL").textContent = n + "マス";
  if (!ac) return;
  const t = ac.currentTime, old = pads;
  for (const p of old) p.g.gain.setTargetAtTime(0, t, 0.3);
  setTimeout(() => { for (const p of old) { try { p.o.stop(); unlinkPitch(p.o); p.out.disconnect(); } catch (_) {} } }, 2000);
  pads = [];
  for (let r = 0; r < GY; r++) for (let c = 0; c < GX; c++) pads.push(mkPad(c));
  for (const s of slots) s.next = 0;
}
function mkPad(col) {
  const o = ac.createOscillator(); o.type = "triangle";
  const f0 = 180 + Math.random() * 120; o.frequency.value = f0;
  const g = ac.createGain(); g.gain.value = 0;
  let out = g;
  if (ac.createStereoPanner) { out = ac.createStereoPanner(); out.pan.value = GX > 1 ? (col / (GX - 1) * 2 - 1) * 0.8 : 0; g.connect(out); }
  o.connect(g); out.connect(padBus);
  linkPitch(o);
  o.start(ac.currentTime + Math.random() * 0.05);
  return { o, g, out, freq: f0, snap: null, midi: 57 };
}

function setOn(on) {
  if (!ac) return;
  running = on;
  const t = ac.currentTime;
  master.gain.cancelScheduledValues(t);
  master.gain.setValueAtTime(master.gain.value, t);
  master.gain.setTargetAtTime(on ? 1 : 0, t, on ? 0.3 : 0.05);   // アンビエントなので、入りはふわっと
  powerBtn.textContent = on ? "ON" : "OFF";
  powerBtn.classList.toggle("off", !on);
}

/* ---------- 表示と解析で同じ切り抜き（画面に見えている範囲＝マス目） ---------- */
function crop() {
  const W = innerWidth, H = innerHeight, vw = video.videoWidth, vh = video.videoHeight;
  const sc = Math.max(W / vw, H / vh), sw = W / sc, sh = H / sc;
  return { sx: (vw - sw) / 2, sy: (vh - sh) / 2, sw, sh };
}

/* ---------- 解析と発音（毎ティック） ---------- */
const wb = { r: 1, g: 1, b: 1 };
let key = null, keyCand = null, keyCandSince = 0, susOn = false;
let locked = null, lastT = null, lastGrainAt = 0;
const scene = { mean: 0.5, dark: 0, gray: 0 };
const slots = LOOP_RATIOS.map(() => ({ next: 0 }));

function tick() {
  if (!video.videoWidth || !ac) return;
  const AW = ana.width, AH = ana.height, n = GX * GY;
  const { sx, sy, sw, sh } = crop();
  actx2d.drawImage(video, sx, sy, sw, sh, 0, 0, AW, AH);
  const px = actx2d.getImageData(0, 0, AW, AH).data;

  // マスごとの平均色＋ホワイトバランス用の白っぽい部分の平均
  const R = new Float32Array(n), Gc = new Float32Array(n), B = new Float32Array(n);
  let wr = 0, wg = 0, wbb = 0, wc = 0;
  for (let y = 0, p = 0; y < AH; y++) {
    const rowBase = Math.floor(y / CELL_PX) * GX;
    for (let x = 0; x < AW; x++, p += 4) {
      const r = px[p], g = px[p + 1], b = px[p + 2], i = rowBase + Math.floor(x / CELL_PX);
      R[i] += r; Gc[i] += g; B[i] += b;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      if (mx > 50 && mx < 250 && (mx - mn) / mx < 0.15) { wr += r; wg += g; wbb += b; wc++; }
    }
  }
  if (wc > AW * AH * 0.05 && wr && wg && wbb) {
    const avg = (wr + wg + wbb) / 3, gain = s => clamp(Math.pow(avg / s, 0.6), 0.75, 1.35);
    wb.r = lerp(wb.r, gain(wr), 0.1); wb.g = lerp(wb.g, gain(wg), 0.1); wb.b = lerp(wb.b, gain(wbb), 0.1);
  }
  const px2 = CELL_PX * CELL_PX;
  const hist = new Float32Array(12), histN = new Float32Array(12), histV = new Float32Array(12),
        histX = new Float32Array(12), histY = new Float32Array(12);
  let vsum = 0, dark = 0, gray = 0, motion = 0;
  for (let i = 0; i < n; i++) {
    const r0 = R[i] / px2, g0 = Gc[i] / px2, b0 = B[i] / px2;
    const L = 0.299 * r0 + 0.587 * g0 + 0.114 * b0;
    motion += Math.abs(L - prevL[i]); prevL[i] = L;
    const [h, s0, v] = rgb2hsv(Math.min(255, r0 * wb.r), Math.min(255, g0 * wb.g), Math.min(255, b0 * wb.b));
    const s = v > 0.08 ? s0 : 0;
    const c = cells[i]; c.h = h; c.s = s; c.v = v;
    vsum += v; if (v < 0.2) dark++; if (s < 0.15) gray++;
    if (s > 0.15 && v > 0.15) {
      const k = Math.floor(h / 30) % 12, w = s * s, a = h * Math.PI / 180;
      hist[k] += w; histN[k]++; histV[k] += v * w; histX[k] += Math.cos(a) * w; histY[k] += Math.sin(a) * w;
    }
  }
  motion /= n;
  scene.mean = lerp(scene.mean, vsum / n, 0.1);
  scene.dark = lerp(scene.dark, dark / n, 0.1);
  scene.gray = lerp(scene.gray, gray / n, 0.1);

  /* 調：いちばん多い色（彩度で重み付け）の感情から。画面の大半が白・黒・グレーなら無彩色として扱う。
     違う調の状態が続いたら転調する（呼吸がゆっくりなほど、長く待つ） */
  let best = 0, total = 0;
  for (let k = 0; k < 12; k++) { total += hist[k]; if (hist[k] > hist[best]) best = k; }
  const chroma = total > n * 0.03 && scene.gray < 0.8;
  // 2番目に多い色（1位の隣の区画は除く）と1位との色相の離れ具合。サティの2つめの和音に使う
  let best2 = -1;
  for (let k = 0; k < 12; k++) {
    const d = Math.min((k - best + 12) % 12, (best - k + 12) % 12);
    if (d > 1 && hist[k] > hist[best] * 0.2 && (best2 < 0 || hist[k] > hist[best2])) best2 = k;
  }
  const hueGap = chroma && best2 >= 0 ? Math.min((best2 - best + 12) % 12, (best - best2 + 12) % 12) * 30 : null;
  let dom, domHue = 0;
  if (chroma) {
    domHue = Math.atan2(histY[best], histX[best]) * 180 / Math.PI; if (domHue < 0) domHue += 360;
    dom = classify(domHue / 360, true, histV[best] / hist[best]);
  } else dom = classify(0, false, scene.mean);
  const rootPc = ((freqToMidi(dom.baseFreq) % 12) + 12) % 12;
  const sig = dom.emotion + "/" + dom.scale + "/" + rootPc, now = performance.now();
  const breath = +breathEl.value, coh = +cohEl.value;
  if (!key) key = { ...dom, rootPc, sig };
  else if (sig !== key.sig) {
    if (!keyCand) keyCandSince = now;
    keyCand = { ...dom, rootPc, sig };
    if (now - keyCandSince > lerp(2500, 800, breath)) { key = keyCand; keyCand = null; }
  } else keyCand = null;

  if (susOn ? scene.gray < 0.55 : scene.gray > 0.75) susOn = !susOn;
  let T;
  if (locked) T = locked.T;
  else { T = chordTones(SCALES[key.scale].steps, susOn, scene.mean > 0.5); lastT = T; }
  const K = locked ? locked.key : key;
  // 音域ごとに使う構成音：低音は1・5だけ（濁らせない）、中音は1・3・5、高音は7・9も
  const pcsLow = [0, T['5']], pcsMid = [0, T['3'], T['5']], pcsHigh = [0, T['3'], T['5'], T['7'], T['9']];
  const pcsFor = (m, s) => s < 0.12 || m < 50 ? pcsLow : m < 64 ? pcsMid : pcsHigh;

  updateSwell();
  const t = ac.currentTime;
  const norm = 1 / Math.sqrt(n);
  const glide = lerp(3.5, 1.0, breath);

  /* 土台：明るさ＝音域、色相＝その中の位置。まとまりが高いほど構成音へ寄る */
  for (let i = 0; i < n; i++) {
    const p = pads[i], c = cells[i];
    if (!p) continue;
    const free = 45 + Math.pow(c.v, 0.9) * 24 + (c.h / 360) * 8 * smooth(0.04, 0.2, c.s);   // 高くなりすぎない範囲（〜F5）
    const pcs = pcsFor(free, c.s);
    let snap = nearestTone(free, K.rootPc, pcs);
    if (p.snap !== null && pcs.includes((((p.snap - K.rootPc) % 12) + 12) % 12) &&
        Math.abs(free - snap) > Math.abs(free - p.snap) - 0.6) snap = p.snap;
    p.snap = snap;
    const midi = lerp(free, snap, coh);
    p.midi = midi;
    const freq = midiToFreq(midi);
    if (Math.abs(freq / p.freq - 1) > 0.004) { p.o.frequency.setTargetAtTime(freq, t, glide); p.freq = freq; }
    const sw = swell[i];
    const level = (0.25 + 0.75 * c.s) * (0.6 + 0.4 * smooth(0.05, 0.4, c.v)) * (1 + 2.5 * sw) * norm * (satieMode === "off" ? 0.22 : 0.15);   // サティの層があるときは土台を控えめに
    p.g.gain.setTargetAtTime(level, t, sw > 0.05 ? 0.25 : 0.8);
  }

  /* 呼吸：層ごとに、自分の周期が来たら色の強いマス（触れている場所はさらに強く）から1音 */
  const base = lerp(12, 4, breath);
  const nSlots = satieMode === "off" ? SLOTS : 3;   // サティの層があるときは、呼吸する音をまばらに
  for (let k = 0; k < nSlots; k++) {
    const s = slots[k], P = base * LOOP_RATIOS[k];
    if (s.next === 0 || s.next - t > P * 1.5) { s.next = t + Math.random() * P * 0.6; continue; }   // 最初はばらけて入る
    if (t >= s.next) { breathNote(pickCell(), P * 0.75, T, K, pcsFor, coh, breath); s.next = t + P * (0.9 + Math.random() * 0.2); }
  }
  // 触れている場所から湧き出す音
  for (const [, p] of pointers) {
    if (!p.active) continue;
    // なぞって別のマスへ移ったら0.6秒ごと、同じ場所で押さえ続けたら数秒ごと。触れて鳴らす音は短めの余韻で
    const ci = cellAt(p.x, p.y), every = lerp(2.6, 1.3, breath) * 1000;
    if (ci !== p.cell ? now - p.lastNote > 600 : now - p.lastNote > every) {
      p.cell = ci; p.lastNote = now;
      breathNote(ci, lerp(3, 1.6, breath), T, K, pcsFor, coh, Math.max(breath, 0.65));
    }
  }
  // 音程の沈み／浮き：指の動きをそのまま毎回送らず、ここで1/15秒ごとにまとめて送る
  // 細かすぎる変化（12セント未満）は送らない。指を離したときの「0へ戻る」は必ず送る
  if (bendTarget !== bendSent && (Math.abs(bendTarget - bendSent) >= 12 || bendTarget === 0)) {
    bendSent = bendTarget;
    const tc = bendId === null ? 0.5 : 0.25;
    for (const o of pitched) writeDetune(o, t, tc);
  }
  // 鳴り終わった声を眠らせる
  for (const vo of notePool) if (vo.awake && t > vo.busyUntil) sleepVoice(vo);
  for (const vo of piano) if (vo.awake && t > vo.freeAt) sleepVoice(vo);

  // 暗い画面ほどこもり、明るい画面ほどひらける
  warm.frequency.setTargetAtTime(1600 * Math.pow(3.4, clamp(scene.mean * 1.2, 0, 1)), t, 1.5);
  padLP.frequency.setTargetAtTime(900 * Math.pow(3, clamp(scene.mean * 1.2, 0, 1)), t, 1.5);
  revGain.gain.setTargetAtTime(+revEl.value * 1.15, t, 0.2);
  // 持続音
  const root = 36 + K.rootPc;
  drone.d1.frequency.setTargetAtTime(midiToFreq(root), t, 2);
  drone.d2.frequency.setTargetAtTime(midiToFreq(root + T['5']), t, 2);
  drone.g.gain.setTargetAtTime(locked ? 0.13 : 0.04 + 0.03 * smooth(0.15, 0.6, scene.dark), t, locked ? 0.8 : 1.5);
  // 粒：ヒス・プチプチ、映像が動いた分だけデジタルの粒
  const grit = +gritEl.value;
  hissG.gain.setTargetAtTime(0.003 + grit * 0.014, t, 0.5);
  crkG.gain.setTargetAtTime(0.02 + grit * 0.18, t, 0.5);
  const pg = clamp((motion - 2) / 14, 0, 1) * (0.25 + 0.6 * grit) + grit * 0.1;
  if (Math.random() < pg && now - lastGrainAt > 60) { lastGrainAt = now; grain(T, K); }
  // サティの層
  satieTick(K, SCALES[K.scale].steps, hueGap, motion, breath);

  keyEl.textContent = (locked ? '［固定］' : '') + `${K.emotion} · ${NOTE_NAMES[K.rootPc]} ${SCALES[K.scale].ja}` +
    (satieMode !== "off" ? ` ｜ ${sat.label}` : coh > 0.5 ? ` ｜ ${chordName(K.rootPc, T)}` : '');
  // 電源ボタンを、調を決めた色に（無彩色なら画面の明るさに合わせた白〜グレー〜黒）
  if (chroma) {
    const sat = Math.round(clamp(Math.sqrt(hist[best] / histN[best]), 0, 1) * 85);
    const lit = Math.round(25 + 25 * histV[best] / hist[best]);
    powerBtn.style.background = `hsl(${domHue},${sat}%,${lit}%)`;
    powerBtn.style.color = "#fff";
  } else {
    const lit = Math.round(clamp(scene.mean, 0, 1) * 92 + 4);
    powerBtn.style.background = `hsl(0,0%,${lit}%)`;
    powerBtn.style.color = lit > 60 ? "#000" : "#fff";
  }
}
// 色の強いマスほど選ばれやすい（くすんだマスも、たまに選ばれる）。触れている場所はとても選ばれやすい
function pickCell() {
  let sum = 0;
  const w = cells.map((c, i) => { const x = (0.12 + c.s * (0.3 + c.v) * 2) * (1 + 6 * swell[i]); sum += x; return x; });
  let r = Math.random() * sum;
  for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return i; }
  return w.length - 1;
}
/* ---------- 呼吸する音：最初に8声を作っておき、使い回す ----------
   鳴らすたびに部品を作って捨てると、その瞬間に負荷の山ができて音が途切れる。
   Gaze と同じく部品は鳴らしっぱなしにして、音程・音色・満ち引きの予定だけを書き換える */
const MAX_NOTES = 8;
const notePool = [];
function initNotePool() {
  for (let i = 0; i < MAX_NOTES; i++) {
    const o = ac.createOscillator(); o.type = "sine";
    const saw = ac.createOscillator(); saw.type = "sawtooth";
    const sh = ac.createOscillator(); sh.type = "sine";
    o.frequency.value = saw.frequency.value = 220; sh.frequency.value = 440;
    const oG = ac.createGain(), sawG = ac.createGain(), shG = ac.createGain();
    oG.gain.value = 1; sawG.gain.value = 0; shG.gain.value = 0;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 0.4; lp.frequency.value = 400;
    const env = ac.createGain(); env.gain.value = 0;
    o.connect(oG).connect(lp); saw.connect(sawG).connect(lp);
    lp.connect(env);
    let pan = null;
    if (ac.createStereoPanner) { pan = ac.createStereoPanner(); pan.connect(bus); }
    sh.connect(shG);   // 1オクターブ上のきらめきは残響の中だけで鳴る
    linkPitch(o, 0); linkPitch(saw, 7); linkPitch(sh, 0);
    o.start(); saw.start(); sh.start();
    const vo = { o, saw, sh, oG, sawG, shG, lp, env, pan, startAt: -1, busyUntil: 0, m: -1,
                 awake: true, outs: [[env, pan || bus], [shG, shimmer]], oscs: [o, saw, sh] };
    for (const [node, dest] of vo.outs) node.connect(dest);
    sleepVoice(vo);
    notePool.push(vo);
  }
}
// その時刻から先の予定を消し、今の値から続ける（値が飛ばないのでプツッとしない）
function holdParam(p, t) {
  if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t);
  else { p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); }
}
const isSounding = (m, now) => notePool.some(v => now < v.busyUntil && v.m === m);

// 呼吸する音：数秒かけて満ちて引く。サイン波が中心、鮮やかなマスほどやわらかいノコギリ波が混ざる
function breathNote(ci, dur, T, K, pcsFor, coh, breath) {
  const c = cells[ci];
  if (!c || !notePool.length) return;
  const now = ac.currentTime;
  const free = 50 + Math.pow(c.v, 0.9) * 22 + (c.h / 360) * 7 * smooth(0.05, 0.2, c.s);   // 〜G5 まで
  let m = nearestTone(free, K.rootPc, pcsFor(free, c.s));
  if (isSounding(m, now)) m = isSounding(m - 12, now) || m - 12 < 48 ? m + 12 : m - 12;   // 重なったら、まず下のオクターブへ
  if (m > 81) m -= 12;
  const midi = lerp(free, m, coh);   // まとまりが低いほど、構成音から滲んだ高さで鳴る
  const f = midiToFreq(midi), s = c.s, v = c.v;
  const atk = lerp(3.5, 0.8, breath), rel = lerp(6, 2.5, breath), hold = Math.max(0.4, dur - atk);

  // 空いている声を使う。全部ふさがっていたら、いちばん古い声を0.3秒ほどでそっと消してから使う
  let vo = notePool.find(x => now >= x.busyUntil), t;
  if (vo) t = now + 0.03;
  else {
    vo = notePool.reduce((a, b) => (a.startAt <= b.startAt ? a : b));
    for (const p of [vo.env.gain, vo.shG.gain, vo.lp.frequency]) holdParam(p, now);
    vo.env.gain.setTargetAtTime(0, now, 0.06);
    vo.shG.gain.setTargetAtTime(0, now, 0.06);
    t = now + 0.3;
  }
  const tRel = t + atk + hold;
  wakeVoice(vo);
  vo.m = m; vo.startAt = t; vo.busyUntil = tRel + rel * 1.6;
  glow[ci] = 1; glowNote[ci] = NOTE_NAMES[((Math.round(midi) % 12) + 12) % 12] + (Math.floor(Math.round(midi) / 12) - 1);

  // 音が消えている瞬間に、音程・音色・左右の位置を切り替える
  vo.o.frequency.setValueAtTime(f, t);
  vo.saw.frequency.setValueAtTime(f, t);
  vo.sh.frequency.setValueAtTime(f * 2, t);
  vo.oG.gain.setValueAtTime(1.1 - 0.55 * s, t);
  const sawL = Math.pow(s, 1.2) * 0.5;
  vo.sawG.gain.setValueAtTime(sawL > 0.06 ? sawL : 0, t);
  if (vo.pan) vo.pan.pan.setValueAtTime(((ci % GX) / Math.max(1, GX - 1) * 2 - 1) * 0.7, t);
  // きらめき（明るいマスほど）
  vo.shG.gain.setTargetAtTime(v > 0.45 && midi < 74 ? 0.022 * smooth(0.4, 0.9, v) : 0, t + atk * 0.5, atk / 2);   // 高い音には足さない
  vo.shG.gain.setTargetAtTime(0, tRel, rel / 4);
  // フィルターが息をするように開いて閉じる
  vo.lp.frequency.setValueAtTime(f * 1.2, t);
  vo.lp.frequency.setTargetAtTime(Math.min(4500, f * (2 + 5 * s) * (0.6 + 0.5 * v)), t, atk / 2);
  vo.lp.frequency.setTargetAtTime(f * 1.1, tRel, rel / 3);
  // 満ちて引く
  const peak = 0.13 * (0.55 + 0.45 * v);
  vo.env.gain.setTargetAtTime(peak, t, atk / 3);
  vo.env.gain.setTargetAtTime(0, tRel, rel / 4);
}

/* ---------- デジタルの粒：これも4つを作っておき、順番に使い回す ---------- */
const grainPool = [];
let grainIdx = 0;
function initGrainPool() {
  const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true; src.start();
  for (let i = 0; i < 4; i++) {
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 12; bp.frequency.value = 2000;
    const g = ac.createGain(); g.gain.value = 0;
    src.connect(bp).connect(g);
    let o = g, pan = null;
    if (ac.createStereoPanner) { pan = ac.createStereoPanner(); g.connect(pan); o = pan; }
    o.connect(conv); o.connect(bus);
    grainPool.push({ bp, g, pan });
  }
}
// ノイズを構成音の高さで細く切り出した、短いきらめき
function grain(T, K) {
  const gr = grainPool[grainIdx++ % grainPool.length];
  if (!gr) return;
  const t = ac.currentTime + 0.01, d = 0.02 + Math.random() * 0.07;
  const tones = [0, T['3'], T['5'], T['7'], T['9']];
  const f = midiToFreq(60 + K.rootPc + tones[(Math.random() * 5) | 0] + (Math.random() < 0.5 ? 12 : 24));
  holdParam(gr.g.gain, t);
  gr.bp.frequency.setValueAtTime(f, t);
  if (gr.pan) gr.pan.pan.setValueAtTime(Math.random() * 1.6 - 0.8, t);
  gr.g.gain.linearRampToValueAtTime(0.9, t + 0.006);
  gr.g.gain.setTargetAtTime(0, t + 0.012, d / 3);
}

/* ---------- サティの層 ----------
   フェルトをかませたような柔らかいピアノで、
   ・3拍子：1拍目に低い根音、2拍目に和音（3拍目まで伸ばす）。画面の多い色1位・2位から作った2つの和音を1小節ごとに行き来し、解決しない
   ・自由：小節線のない、不規則な長さのフレーズ（グノシエンヌ風）。映像が動くと次のフレーズが早く始まる
   ・旋律は2・3拍目にときどき。明るく鮮やかなマスを目指して、ほとんど隣の音へ進み、たまに下へ跳ぶ
   ・主音ロック中は、直前の4小節をそのまま繰り返す（家具の音楽）。繰り返すたびに旋律が少しだけ入れ替わる */
let satieMode = "off";            // "off" | "waltz" | "free"
const PIANO_VOICES = 8;
const piano = [];
let hammer = null;
const sat = { nextT: 0, beat: 0, bar: 0, absBeat: 0, cur: null, A: null, B: null, mel: 69, history: [], loop: null, loopPos: 0,
              left: 0, pause: false, label: "" };

function initPiano() {
  // ピアノらしい倍音の並び（1つのオシレーターで鳴らせる波形にして軽く）
  const amps = [0, 1, 0.42, 0.2, 0.11, 0.07, 0.045, 0.03, 0.018, 0.012, 0.008, 0.005];
  const real = new Float32Array(amps.length), imag = new Float32Array(amps);
  const wave = ac.createPeriodicWave(real, imag);
  const pbus = ac.createGain(); pbus.gain.value = 1;
  pbus.connect(bus);
  for (let i = 0; i < PIANO_VOICES; i++) {
    const o = ac.createOscillator(); o.setPeriodicWave(wave); o.frequency.value = 220;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 0.3; lp.frequency.value = 800;
    const env = ac.createGain(); env.gain.value = 0;
    // 本物のピアノは1つの音に弦が2〜3本あり、わずかにずれてうなる。サイン波を1本、少しずらして重ねる
    const s2 = ac.createOscillator(); s2.type = "sine"; s2.frequency.value = 220;
    const wG = ac.createGain(), sG = ac.createGain(); wG.gain.value = 1; sG.gain.value = 0.25;
    o.connect(wG).connect(lp); s2.connect(sG).connect(lp);
    lp.connect(env);
    let pan = null;
    if (ac.createStereoPanner) { pan = ac.createStereoPanner(); pan.connect(pbus); }
    linkPitch(o, 0); linkPitch(s2, 1.8); o.start(); s2.start();
    const vo = { o, s2, wG, sG, lp, env, pan, startAt: -1, freeAt: 0, awake: true, outs: [[env, pan || pbus]], oscs: [o, s2] };
    env.connect(pan || pbus);
    sleepVoice(vo);
    piano.push(vo);
  }
  // ハンマーの「コツッ」：ノイズを短く切り出す（2つを使い回す）
  const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true; src.start();
  hammer = [0, 1].map(() => {
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1800; bp.Q.value = 1.2;
    const g = ac.createGain(); g.gain.value = 0;
    src.connect(bp).connect(g).connect(pbus);
    return { bp, g };
  });
}
let hammerIdx = 0;
// round=true：旋律の単音用。倍音を抑えてサイン寄りにし、立ち上がりを少し遅く、すぐ丸くこもる「ポーン」という音
function pianoNote(midi, vel, t, pan = 0, round = false) {
  const vo = piano.reduce((a, b) => (a.startAt <= b.startAt ? a : b));   // いちばん古い声を使う
  wakeVoice(vo);
  const f = midiToFreq(midi);
  // 前の音が残っていたら、打つ直前の15msで消す
  const e = vo.env.gain;
  if (e.cancelAndHoldAtTime) e.cancelAndHoldAtTime(t - 0.015); else e.cancelScheduledValues(t - 0.015);
  e.linearRampToValueAtTime(0, t);
  vo.o.frequency.setValueAtTime(f, t);
  vo.s2.frequency.setValueAtTime(f, t);
  vo.wG.gain.setValueAtTime(round ? 0.45 : 1, t);
  vo.sG.gain.setValueAtTime(round ? 0.8 : 0.25, t);
  if (vo.pan) vo.pan.pan.setValueAtTime(pan, t);
  // 打鍵：すぐ立ち上がり、低い音ほど長く減衰する（丸い音は少しだけ長く響かせる）
  const peak = 0.22 * vel, tau = clamp(2.6 - (midi - 48) * 0.05, 0.7, 3.2) * (round ? 1.3 : 1);
  e.linearRampToValueAtTime(peak, t + (round ? 0.014 : 0.006));
  e.setTargetAtTime(peak * (round ? 0.5 : 0.35), t + 0.015, round ? 0.4 : 0.25);
  e.setTargetAtTime(0, t + 0.5, tau);
  vo.freeAt = t + 0.5 + tau * 6;   // ここまでに聞こえなくなるので、そのあと眠らせる
  // フェルト：強く打つほど明るく、すぐこもっていく（丸い音は最初からこもらせ、高い音ほど早く丸める）
  const lpf = vo.lp.frequency;
  if (lpf.cancelAndHoldAtTime) lpf.cancelAndHoldAtTime(t); else lpf.cancelScheduledValues(t);
  if (round) {
    lpf.setValueAtTime(Math.min(3200, f * (1.6 + 1.6 * vel)), t);
    lpf.setTargetAtTime(Math.min(2000, f * 1.08), t + 0.01, 0.25);
  } else {
    lpf.setValueAtTime(Math.min(6000, f * (2.5 + 5 * vel)), t);
    lpf.setTargetAtTime(Math.min(3000, f * 1.6), t + 0.01, 0.5);
  }
  vo.startAt = t;
  const h = hammer[hammerIdx++ % hammer.length];
  if (h.g.gain.cancelAndHoldAtTime) h.g.gain.cancelAndHoldAtTime(t); else h.g.gain.cancelScheduledValues(t);
  h.bp.frequency.setValueAtTime(Math.min(round ? 2500 : 5000, f * (round ? 2.5 : 4)), t);
  h.g.gain.linearRampToValueAtTime((round ? 0.025 : 0.05) * vel, t + 0.002);
  h.g.gain.setTargetAtTime(0, t + 0.004, round ? 0.012 : 0.008);
}

// スケールの中で3度ずつ積んだ和音（rootIdx はスケールの何番目の音から積むか）
function diatonicChord(steps, rootIdx) {
  const len = steps.length, semi = j => steps[j % len] + 12 * Math.floor(j / len);
  const r = semi(rootIdx);
  return { root: r % 12, iv: [0, 2, 4, 6].map(k => semi(rootIdx + k) - r) };
}
function chordLabelOf(rootPc, ch) {
  const n = NOTE_NAMES[(rootPc + ch.root) % 12];
  const third = ch.iv[1], sev = ch.iv[3] % 12;
  const q = third === 3 ? 'm' : third === 4 ? '' : '';
  const s = third === 2 ? 'sus2' : third === 5 ? 'sus4' : third !== 3 && third !== 4 ? '(4度)' : '';
  return n + q + (sev === 11 ? 'maj7' : sev === 10 ? '7' : sev === 9 ? '6' : '') + s;
}
// 2つめの和音：多い色の1位と2位がどれだけ離れているかで、IV・VI・II のどれにするか決める
function chooseChords(steps, hueGap) {
  const len = steps.length;
  const deg = hueGap === null ? 3 / 7 : hueGap < 60 ? 3 / 7 : hueGap < 120 ? 5 / 7 : 1 / 7;
  let idx = Math.round(deg * len) % len; if (idx === 0) idx = 1;
  return { A: diatonicChord(steps, 0), B: diatonicChord(steps, idx) };
}
// 旋律：明るく鮮やかなマスを目指して、ほとんど隣の音へ。たまに下へ跳ぶ
function melodyNote(K, steps) {
  const ci = pickCell(), c = cells[ci];
  const target = 60 + Math.pow(c.v, 0.9) * 14 + (c.h / 360) * 4 * smooth(0.05, 0.2, c.s);
  const sc = [];
  for (let m = 57; m <= 79; m++) if (steps.includes(((m - K.rootPc) % 12 + 12) % 12)) sc.push(m);
  const near = x => sc.reduce((bi, m, i) => (Math.abs(m - x) < Math.abs(sc[bi] - x) ? i : bi), 0);
  let i = near(sat.mel), ti = near(target);
  const r = Math.random();
  if (r < 0.18) i -= 2 + (Math.random() < 0.5 ? 1 : 0);
  else if (r < 0.28) { /* 同じ音をもう一度 */ }
  else i += ti > i ? 1 : ti < i ? -1 : (Math.random() < 0.5 ? 1 : -1);
  i = clamp(i, 0, sc.length - 1);
  sat.mel = sc[i];
  glow[ci] = Math.max(glow[ci], 0.8); glowNote[ci] = NOTE_NAMES[sat.mel % 12] + (Math.floor(sat.mel / 12) - 1);
  return { m: sat.mel, v: 0.42 + Math.random() * 0.12, dt: 0, pan: 0.15, round: true };
}
const voiceNear = (pc, center) => { let m = center - 6; while (((m % 12) + 12) % 12 !== pc) m++; return m; };

// 1拍分の音を作る（3拍子）
function waltzBeat(K, steps) {
  const notes = [];
  if (sat.beat === 0) {
    sat.cur = sat.bar % 2 === 0 ? sat.A : sat.B;
    const rootPc = (K.rootPc + sat.cur.root) % 12;
    notes.push({ m: voiceNear(rootPc, 45), v: 0.55, dt: 0, pan: -0.2 });
  } else if (sat.beat === 1) {
    const rootPc = (K.rootPc + sat.cur.root) % 12;
    sat.cur.iv.slice(1).forEach((iv, k) => notes.push({ m: voiceNear((rootPc + iv) % 12, 60), v: 0.3, dt: 0.012 * k, pan: 0.05 }));
  }
  const phraseEnd = sat.bar % 8 === 7;
  if (!phraseEnd && ((sat.beat === 1 && Math.random() < 0.4) || (sat.beat === 2 && Math.random() < 0.35))) notes.push(melodyNote(K, steps));
  return notes;
}

function satieTick(K, steps, hueGap, motion, breath) {
  if (satieMode === "off" || !piano.length) { sat.loop = null; return; }
  const now = ac.currentTime;
  if (!sat.nextT || sat.nextT < now) { sat.nextT = now + 0.15; sat.beat = 0; }
  const { A, B } = chooseChords(steps, hueGap);
  if (!sat.A || sat.beat === 0) { sat.A = A; sat.B = B; }
  sat.label = chordLabelOf(K.rootPc, sat.A) + " ⇄ " + chordLabelOf(K.rootPc, sat.B);
  const beatLen = 60 / lerp(54, 72, breath);
  while (sat.nextT < now + 0.25) {
    const t = sat.nextT;
    if (satieMode === "waltz") {
      let notes;
      if (locked && sat.loop) {
        // 家具の音楽：直前の4小節を繰り返す。繰り返すたびに、旋律がまれに入れ替わる
        notes = sat.loop[sat.loopPos % sat.loop.length];
        if (sat.loopPos % sat.loop.length === 0) sat.loopRound = (sat.loopRound || 0) + 1;
        notes = notes.map(n => (n.pan === 0.15 && Math.random() < 0.12 ? melodyNote(K, steps) : n));
        sat.loop[sat.loopPos % sat.loop.length] = notes;
        sat.loopPos++;
      } else {
        notes = waltzBeat(K, steps);
        sat.history.push(notes); if (sat.history.length > 12) sat.history.shift();
        if (locked && sat.history.length === 12 && sat.beat === 2) { sat.loop = sat.history.slice(); sat.loopPos = 0; }
      }
      if (!locked) sat.loop = null;
      for (const n of notes) pianoNote(n.m, n.v, t + n.dt, n.pan, n.round);
      // 少しだけ揺れるテンポ。フレーズの終わりはゆっくり
      let d = beatLen * (1 + (Math.random() - 0.5) * 0.06);
      if (sat.bar % 8 === 7 && sat.beat === 2) d *= 1.3;
      sat.nextT += d;
      sat.beat = (sat.beat + 1) % 3; if (sat.beat === 0) sat.bar++;
    } else {
      // 自由：フレーズの頭で根音と和音、あとは不規則な長さの旋律。フレーズの間は休む
      if (sat.left <= 0) {
        if (!sat.pause) { sat.pause = true; sat.nextT += beatLen * (2 + Math.random() * 2); continue; }
        sat.pause = false;
        sat.cur = sat.bar++ % 2 === 0 ? sat.A : sat.B;
        const rootPc = (K.rootPc + sat.cur.root) % 12;
        pianoNote(voiceNear(rootPc, 45), 0.5, t, -0.2);
        sat.cur.iv.slice(1).forEach((iv, k) => pianoNote(voiceNear((rootPc + iv) % 12, 60), 0.26, t + 0.25 + 0.03 * k, 0.05));
        sat.left = 3 + ((Math.random() * 5) | 0);
        sat.nextT += beatLen * 1.5;
        continue;
      }
      const n = melodyNote(K, steps);
      pianoNote(n.m, n.v, t, n.pan, true);
      sat.left--;
      sat.nextT += beatLen * [0.5, 0.75, 1, 1, 1.5, 2][(Math.random() * 6) | 0];
    }
  }
  // 自由のときは、映像が大きく動いたら休みを切り上げて次のフレーズへ
  if (satieMode === "free" && sat.pause && motion > 8 && sat.nextT - now > 0.6) sat.nextT = now + 0.3;
}

/* ---------- 主音ロック ---------- */
function toggleLock() {
  if (!started || !key) return;
  if (!locked) {
    const T = lastT || chordTones(SCALES[key.scale].steps, susOn, scene.mean > 0.5);
    locked = { key: { ...key }, T };
    lockBtn.classList.add("on");
    lockBtn.style.background = powerBtn.style.background; lockBtn.style.color = powerBtn.style.color || "#fff";
    lockBtn.innerHTML = `${NOTE_NAMES[key.rootPc]}<small>固定中</small>`;
  } else {
    locked = null;
    lockBtn.classList.remove("on");
    lockBtn.style.background = ""; lockBtn.style.color = "";
    lockBtn.innerHTML = "主音<small>ロック</small>";
  }
}

/* ---------- タッチで演奏 ---------- */
const pointers = new Map();   // id → {x,y,x0,y0,t0,active,cell,lastNote}
let bendId = null;
const HOLD_MS = 220, MOVE_PX = 10;
function cellAt(x, y) {
  return clamp(Math.floor(y / innerHeight * GY), 0, GY - 1) * GX + clamp(Math.floor(x / innerWidth * GX), 0, GX - 1);
}
function activate(p, id) {
  if (p.active) return;
  p.active = true; p.cell = -1; p.lastNote = 0;
  if (bendId === null) { bendId = id; p.y0 = p.y; }
}
function updateSwell() {
  const now = performance.now(), W = innerWidth, H = innerHeight, sig = 0.17 * Math.min(W, H);
  for (const [id, p] of pointers) if (!p.active && now - p.t0 > HOLD_MS) activate(p, id);
  for (let i = 0; i < swell.length; i++) {
    const cx = ((i % GX) + 0.5) / GX * W, cy = (Math.floor(i / GX) + 0.5) / GY * H;
    let w = 0;
    for (const p of pointers.values()) if (p.active) {
      const dx = p.x - cx, dy = p.y - cy;
      w = Math.max(w, Math.exp(-(dx * dx + dy * dy) / (2 * sig * sig)));
    }
    swell[i] += (w - swell[i]) * (w > swell[i] ? 0.25 : 0.08);
  }
}
// テープを手で遅くしたように、音程がゆっくり沈む／浮く（慣性があり、離すとゆっくり戻る）
let bendTarget = 0, bendSent = 0;
function setBend(cents) { bendTarget = Math.round(cents); }
view.addEventListener("pointerdown", e => {
  if (!started) return;
  try { view.setPointerCapture(e.pointerId); } catch (_) {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t0: performance.now(), active: false });
});
view.addEventListener("pointermove", e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (!p.active && Math.hypot(p.x - p.x0, p.y - p.y0) > MOVE_PX) activate(p, e.pointerId);
  if (e.pointerId === bendId) {
    const k = clamp(-(p.y - p.y0) / (innerHeight * 0.4), -1, 1);   // 下へ引く＝沈む、上へ＝浮く（画面の40%で7半音）
    setBend(k * 700);
  }
});
function endPointer(e, cancelled) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  pointers.delete(e.pointerId);
  if (e.pointerId === bendId) { bendId = null; setBend(0); }
  if (!cancelled && !p.active && performance.now() - p.t0 < 350) focusAt(e.clientX, e.clientY);
}
view.addEventListener("pointerup", e => endPointer(e, false));
view.addEventListener("pointercancel", e => endPointer(e, true));
view.addEventListener("contextmenu", e => e.preventDefault());

/* ---------- タップで焦点 ---------- */
let camTrack = null, focusTimer = 0, focusNoticeShown = false;
const ring = $("focusRing");
async function focusAt(cx, cy) {
  if (!camTrack || !video.videoWidth) return;
  const W = innerWidth, Hh = innerHeight, vw = video.videoWidth, vh = video.videoHeight;
  const sc = Math.max(W / vw, Hh / vh), dx = (W - vw * sc) / 2, dy = (Hh - vh * sc) / 2;
  const x = clamp((cx - dx) / (vw * sc), 0, 1), y = clamp((cy - dy) / (vh * sc), 0, 1);
  ring.style.left = cx + "px"; ring.style.top = cy + "px";
  ring.className = "show";
  clearTimeout(focusTimer);
  const caps = camTrack.getCapabilities ? camTrack.getCapabilities() : {};
  const c = {};
  if (caps.focusMode) {
    if (caps.focusMode.includes("single-shot")) c.focusMode = "single-shot";
    else if (caps.focusMode.includes("continuous")) c.focusMode = "continuous";
  }
  if (caps.exposureMode && caps.exposureMode.includes("continuous")) c.exposureMode = "continuous";
  if ("pointsOfInterest" in caps || caps.focusMode) c.pointsOfInterest = [{ x, y }];
  let ok = false;
  if (Object.keys(c).length) {
    try { await camTrack.applyConstraints({ advanced: [c] }); ok = true; } catch (_) {}
  }
  if (!ok) {
    ring.className = "show fail";
    if (!focusNoticeShown) { focusNoticeShown = true; keyEl.dataset.note = "この端末のブラウザは焦点の指定に対応していません"; }
  }
  focusTimer = setTimeout(() => { ring.className = ""; delete keyEl.dataset.note; }, 900);
}

/* ---------- 表示 ---------- */
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  view.width = innerWidth * dpr; view.height = innerHeight * dpr;
  const portrait = innerHeight > innerWidth;
  if ((GY > GX) !== portrait && GX !== GY) buildGrid(gridSpec);
}
addEventListener("resize", resize);

let lastFrame = 0;
function render(ts) {
  requestAnimationFrame(render);
  if (!video.videoWidth) return;
  const dt = Math.min(0.1, (ts - lastFrame) / 1000 || 0); lastFrame = ts;
  const W = view.width, H = view.height, dpr = W / innerWidth;
  const { sx, sy, sw, sh } = crop();
  vctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
  const cw = W / GX, ch = H / GY;
  vctx.font = `${11 * dpr}px system-ui,sans-serif`;
  vctx.textAlign = "left"; vctx.textBaseline = "top";
  for (let i = 0; i < GX * GY; i++) {
    const x = (i % GX) * cw, y = Math.floor(i / GX) * ch, s = swell[i] || 0, g = glow[i] || 0;
    const a = Math.max(0.22 * s, 0.18 * g);
    if (a > 0.01) { vctx.fillStyle = `rgba(255,255,255,${a})`; vctx.fillRect(x, y, cw, ch); }
    vctx.strokeStyle = `rgba(255,255,255,${0.1 + 0.5 * g})`;
    vctx.lineWidth = (1 + 1.5 * g) * dpr;
    vctx.strokeRect(x + 0.5, y + 0.5, cw - 1, ch - 1);
    if (g > 0.05 && glowNote[i]) {
      vctx.fillStyle = `rgba(255,255,255,${0.85 * g})`;
      vctx.fillText(glowNote[i], x + 6 * dpr, y + 6 * dpr);
    }
    glow[i] = g * Math.exp(-dt / 2.5);   // 鳴ったマスの光は、音の余韻のようにゆっくり消える
  }
}

/* ---------- 操作 ---------- */
const cohText = x => x < 0.15 ? "滲み" : x < 0.45 ? "滲み寄り" : x < 0.8 ? "和音寄り" : "和音";
const breathText = x => x < 0.25 ? "ゆっくり" : x < 0.55 ? "ゆったり" : x < 0.8 ? "ふつう" : "速い";
$("satieSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  for (const x of $("satieSeg").children) x.classList.toggle("on", x === b);
  satieMode = b.dataset.s;
  sat.nextT = 0; sat.bar = 0; sat.beat = 0; sat.left = 0; sat.pause = false; sat.loop = null; sat.history = [];
});
cohEl.addEventListener("input", () => { $("cohL").textContent = cohText(+cohEl.value); });
breathEl.addEventListener("input", () => { $("breathL").textContent = breathText(+breathEl.value); });
revEl.addEventListener("input", () => { $("revL").textContent = Math.round(revEl.value * 100) + "%"; });
gritEl.addEventListener("input", () => { $("gritL").textContent = Math.round(gritEl.value * 100) + "%"; });
$("gridSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  for (const x of $("gridSeg").children) x.classList.toggle("on", x === b);
  buildGrid(b.dataset.g);
});
powerBtn.addEventListener("click", () => setOn(!running));
lockBtn.addEventListener("click", toggleLock);
addEventListener("keydown", e => {
  if (e.code === "Space" && started) { e.preventDefault(); setOn(!running); }
  if (e.code === "KeyL" && started) toggleLock();
});
buildGrid(gridSpec);
resize();

$("start").addEventListener("click", async () => {
  if (started) return;
  try {
    initAudio();
    await ac.resume();
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
    });
    video.srcObject = stream;
    camTrack = stream.getVideoTracks()[0];
    const caps = camTrack.getCapabilities ? camTrack.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.includes("continuous")) {
      camTrack.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(() => {});
    }
    await video.play();
    buildGrid(gridSpec);
    started = true;
    $("start").style.display = "none";
    setOn(true);
    setInterval(tick, TICK);
    requestAnimationFrame(render);
  } catch (err) {
    $("msg").textContent = "カメラを開始できませんでした：" + (err && err.message || err) +
      "（スマホでは https で開く必要があります）";
  }
});
})();
</script>
